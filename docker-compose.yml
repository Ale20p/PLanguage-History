
services:
  postgres:
    image: postgres:16-alpine
    container_name: planguage-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: planguage_history
      POSTGRES_USER: planguage_admin
      POSTGRES_PASSWORD: planguage_dev_2026
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./docs/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planguage_admin -d planguage_history"]
      interval: 10s
      timeout: 5s
      retries: 5

  compiler-daemon:
    build:
      context: ./services/compiler-daemon
      dockerfile: Dockerfile
    image: planguage-compiler-daemon:latest
    container_name: planguage-compiler-daemon
    restart: unless-stopped
    ports:
      - "50051:50051"
    environment:
      - COMPILER_PORT=50051
    tmpfs:
      - /tmp:exec,mode=1777,size=128M
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 50051 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  pgdata:
